services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sliac_sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD:-YourStrong@Password123!}
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./docker-init:/docker-init:ro
    networks:
      - sliac-network
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "YourStrong@Password123!" -Q "SELECT 1" -b || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sliac_db_init
    environment:
      - SA_PASSWORD=${SA_PASSWORD:-YourStrong@Password123!}
      - SQL_SERVER_HOST=sqlserver
    volumes:
      - ./docker-init:/docker-init:ro
    networks:
      - sliac-network
    entrypoint: ["/bin/bash", "/docker-init/init-database.sh"]
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sliac_api
    ports:
      - "5000:80"
      - "5001:443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=fantasy_proj;User Id=sa;Password=${SA_PASSWORD:-YourStrong@Password123!};TrustServerCertificate=True;Multiple Active Result Sets=True
      - JwtSettings__Secret=${JWT_SECRET:-SliacFantasyFootball2025SecureJwtKeyForAuthenticationAndAuthorization!@#MinimumLengthRequired}
      - JwtSettings__Issuer=SliacFantasyAPI
      - JwtSettings__Audience=SliacFantasyClient
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    networks:
      - sliac-network

volumes:
  sqlserver_data:
    driver: local

networks:
  sliac-network:
    driver: bridge

